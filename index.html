<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patsy's Tavern & Restaurant | Premium Dining</title>
    <style>
        :root {
            --primary: #9d2235;
            --accent: #d4af37;
            --glass-bg: rgba(26, 15, 18, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow: rgba(212, 175, 55, 0.3);
            --text: #f5f5f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #0d0608;
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* Ambient Animated Background Blobs */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(157,34,53,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
            animation: floatGlow 12s infinite ease-in-out alternate;
        }
        
        .ambient-glow-2 {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212,175,55,0.06) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: -1;
            animation: floatGlow 18s infinite ease-in-out alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.15); }
        }

        /* Premium Frosted Header */
        header {
            text-align: center;
            padding: 4.5rem 1rem 3.5rem;
            position: relative;
        }

        header h1 {
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        header p {
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b0a8b3;
            margin-top: 0.75rem;
        }

        /* Glassmorphic Navigation Bar */
        nav {
            position: sticky;
            top: 20px;
            max-width: 650px;
            margin: 0 auto;
            background: rgba(20, 10, 12, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.8rem;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        nav a:hover, nav a.active {
            color: #fff;
            background: var(--primary);
            box-shadow: 0 0 15px rgba(157,34,53,0.6);
            text-shadow: 0 1px 5px rgba(255,255,255,0.2);
        }

        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        /* Glassmorphic Section Cards */
        section {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 3rem;
            margin-bottom: 3.5rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        section:hover {
            border-color: rgba(212,175,55,0.25);
            transform: translateY(-4px);
        }

        h2 {
            font-family: 'Georgia', serif;
            font-size: 2rem;
            color: #fff;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(212,175,55,0.4), transparent);
        }

        /* Filter Controls */
        .menu-filters {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: #ccc;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Interactive Grid Layouts */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255,255,255,0.04);
            padding: 1.75rem;
            border-radius: 16px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-card:hover {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-color: rgba(255,255,255,0.1);
        }

        .menu-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
        }

        .menu-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
        }

        .menu-price {
            font-family: monospace;
            color: var(--accent);
            font-size: 1.15rem;
            font-weight: bold;
        }

        .menu-desc {
            font-size: 0.92rem;
            color: #a09ba3;
            font-style: italic;
        }

        /* Two-Column Grid For Location Details */
        .grid-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        @media (max-width: 768px) {
            .grid-split { grid-template-columns: 1fr; gap: 2rem; }
            header h1 { font-size: 2.3rem; }
            section { padding: 1.75rem; }
            nav { width: 90%; }
        }

        .info-list {
            list-style: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .info-row span:first-child {
            color: #a09ba3;
            font-weight: 500;
        }

        .info-row span:last-child {
            color: #fff;
            font-weight: 600;
        }

        /* Mock Map Visual Component */
        .map-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(0,0,0,0.2));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: #a09ba3;
            position: relative;
            min-height: 200px;
        }

        .map-icon {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            animation: pulsePin 2s infinite ease-in-out;
        }

        @keyframes pulsePin {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Futuristic Form Interface */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 500px) {
            .form-row { grid-template-columns: 1fr; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b0a8b3;
            font-weight: 600;
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 0.9rem 1.2rem;
            color: #fff;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(212,175,55,0.15);
        }

        textarea { resize: none; }

        /* Premium Glow Action Button */
        .btn-glow {
            background: linear-gradient(135deg, var(--primary) 0%, #b82e45 100%);
            color: #fff;
