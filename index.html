<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bergen Coffee Roasters</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-secondary: #1a1a1a;
            --accent-gold: #cca450;
            --text-primary: #ffffff;
            --text-muted: #9c9a9d;
            --input-border: rgba(255, 255, 255, 0.2);
            --smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.7;
            margin: 0;
            padding: 0;
        }

        /* Minimal Header Menu Utilities */
        nav {
            position: sticky;
            top: 0;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.5rem 2rem;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: var(--smooth);
        }

        nav a:hover {
            color: var(--text-primary);
        }

        header {
            text-align: center;
            padding: 7rem 1rem 3rem;
        }

        header h1 {
            font-family: 'Georgia', serif;
            font-size: 2.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
        }

        header p {
            color: var(--accent-gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Symmetric Circle Image Trio Showcase */
        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3rem;
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 6rem;
        }

        @media (max-width: 900px) {
            .showcase-grid {
                grid-template-columns: 1fr;
                gap: 4.5rem;
            }
        }

        .showcase-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-frame {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--smooth);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            background-color: #1a1a1a;
        }

        .showcase-card:hover .circle-frame {
            transform: scale(1.04);
            border-color: var(--accent-gold);
            box-shadow: 0 15px 40px rgba(204, 164, 80, 0.15);
        }

        .circle-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .showcase-title {
            font-family: 'Georgia', serif;
            font-size: 1.45rem;
            margin-bottom: 1rem;
            font-weight: 400;
        }

        .showcase-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.8;
            max-width: 320px;
        }

        /* Continuous Wide Background Visual Break */
        .action-banner {
            width: 100%;
            height: 480px;
            overflow: hidden;
            position: relative;
            margin-bottom: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(15%) brightness(75%);
        }

        /* Seamless Customer Inquiries Submission Box */
        .contact-section {
            background-color: var(--bg-secondary);
            padding: 6rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .contact-box {
            max-width: 500px;
            margin: 0 auto;
        }

        .contact-box h2 {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .contact-box p {
            text-align: center;
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 3.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, textarea {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid var(--input-border);
            padding: 0.8rem 0;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--smooth);
        }

        input:focus, textarea:focus {
            outline: none;
            border-bottom-color: var(--text-primary);
        }

        textarea {
            resize: none;
        }

        button {
            background-color: var(--text-primary);
            color: var(--bg-main);
            border: none;
            padding: 1.2rem;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: var(--smooth);
        }

        button:hover {
            background-color: var(--accent-gold);
            color: #000000;
        }

        footer {
            text-align: center;
            padding: 5rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            background-color: var(--bg-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <nav>
        <a href="#about">About</a>
        <a href="#specials">Specials</a>
        <a href="#contact">Contact</a>
    </nav>

    <header>
        <h1>About Bergen Coffee Roasters</h1>
        <p>20 Sheridan Ave · Ho-Ho-Kus, NJ 07423</p>
    </header>

    <div class="container">
        
        <!-- Interactive Editorial Trio Panels -->
        <div class="showcase-grid" id="about">
            
            <div class="showcase-card">
                <div class="circle-frame">
                    <img src="https://unsplash.com" alt="Our Story" class="circle-img">
                </div>
                <h3 class="showcase-title">Our Story</h3>
                <p class="showcase-desc">To be decided</p>
            </div>

            <div class="showcase-card">
                <div class="circle-frame">
                    <img src="https://unsplash.com" alt="Our Mission" class="circle-img">
                </div>
                <h3 class="showcase-title">Our Mission</h3>
                <p class="showcase-desc">To be decided</p>
            </div>

            <div class="showcase-card">
                <div class="circle-frame">
                    <img src="https://unsplash.com" alt="Our Team" class="circle-img">
                </div>
                <h3 class="showcase-title">Our Team</h3>
                <p class="showcase-desc">To be decided</p>
            </div>

        </div>

    </div>

    <!-- Wide Atmospheric Media Break -->
    <div class="action-banner" id="specials">
        <img src="https://unsplash.com" alt="Fresh Small Batch Coffee Beans roasting" class="banner-img">
    </div>

    <!-- Editorial Inquiries Form Block -->
    <div class="contact-section" id="contact">
        <div class="contact-box">
            <h2>Questions?</h2>
            <p>Contact us</p>
            
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Message dispatched safely to Bergen Coffee Roasters.');">
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label for="email">Email*</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="4" required></textarea>
                </div>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Copyright © 2026 Bergen Coffee - All Rights Reserved.</p>
    </footer>

</body>
</html>
